<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oorlogsgravenstichting op de kaart · 1940–1945</title>
<meta name="description" content="Herkomst en sterfteplaatsen van de in het archief van de Oorlogsgravenstichting vastgelegde slachtoffers (Nationaal Archief 2.19.255), op de kaart.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#eef0f2;--panel:#fff;--ink:#232a31;--muted:#6b7480;--line:#dde1e5;
        --accent:#4a5a6a;--accent-dark:#33414e;--hi:#8a99a8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  #map{position:absolute;inset:0;background:#e7eaec}
  .leaflet-container{background:#e7eaec}
  .ptabs{position:fixed;top:14px;left:14px;z-index:1200;display:flex;gap:2px;width:340px;max-width:calc(100vw - 28px);
    justify-content:space-between;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:12px;padding:4px 6px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .ptabs a{font-size:12.5px;color:var(--ink);text-decoration:none;padding:6px 9px;border-radius:8px;white-space:nowrap}
  .ptabs a.on{background:var(--accent);color:#fff}
  .ptabs a:not(.on):hover{background:#eef2f5;color:var(--accent)}
  .ptabs a.ext{color:var(--accent)}
  #side{position:fixed;top:60px;left:14px;z-index:1100;width:340px;max-width:calc(100vw - 28px);max-height:calc(100vh - 74px);
    overflow-y:auto;overflow-x:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 22px rgba(0,0,0,.10)}
  .pad{padding:14px 16px}
  h1{margin:0;font-size:17px;letter-spacing:-.01em;font-weight:700}
  .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .qm{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#e7ebef;color:var(--muted);
    font-size:11px;font-weight:600;cursor:default;vertical-align:middle;margin-left:2px}
  #viztip{position:fixed;z-index:9999;background:#232a31;color:#fff;padding:7px 10px;border-radius:8px;font-size:12.5px;
    line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.28);pointer-events:none;opacity:0;transition:opacity .12s;max-width:270px}
  #viztip.on{opacity:1}
  .srcline{font-size:11.5px;color:var(--muted);margin:6px 0 8px}
  .srcline a{color:var(--accent);text-decoration:none;font-weight:500}.srcline a:hover{text-decoration:underline}
  .count{font-size:12px;color:var(--muted);margin:0 0 4px}.count b{color:var(--accent);font-variant-numeric:tabular-nums}.count .pct{color:var(--muted)}
  .flabel{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:11px 0 4px}
  /* primaire kaartlaag-keuze: prominent */
  .modes{display:flex;gap:5px}
  .modes button{flex:1;border:1px solid var(--line);background:#fff;padding:9px 6px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:600}
  .modes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  /* zoekgroep: subtieler, duidelijk ondergeschikt */
  .searchgroup{margin-top:2px;border-top:1px solid var(--line);padding-top:2px}
  .stog{display:flex;gap:3px;background:var(--bg);padding:3px;border-radius:8px;margin:0 0 6px;font-size:11.5px}
  .stog button{flex:1;border:0;background:transparent;padding:5px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600}
  .stog button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .search{position:relative}
  .search input{width:100%;font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .sug{margin-top:4px;border:1px solid var(--line);border-radius:9px;overflow:hidden;display:none;background:#fff}
  .sug a{display:block;padding:7px 11px;font-size:12.5px;color:var(--ink);text-decoration:none;cursor:pointer;border-top:1px solid #eef1f3}
  .sug a:first-child{border-top:0}.sug a:hover{background:#f2f5f7}
  .sug .hdr{padding:5px 11px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#f6f8f9}
  .sug small{color:var(--muted)}
  .legend{position:absolute;bottom:22px;left:12px;z-index:900;background:rgba(255,255,255,.94);border:1px solid var(--line);
    border-radius:9px;padding:8px 11px;font-size:11px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .legend .lt{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
  .legrow{display:flex;align-items:center;gap:7px;line-height:1.6}
  .legrow .sw{width:12px;height:12px;border-radius:50%;border:.5px solid rgba(0,0,0,.2);flex:none}
  .pfoot{border-top:1px solid var(--line);padding:11px 16px;font-size:12px}
  .pfoot a{color:var(--accent);text-decoration:none}.pfoot a:hover{text-decoration:underline}
  /* namenpaneel: vast, rechts, volledige hoogte */
  #names{position:fixed;top:0;right:0;bottom:0;z-index:1120;width:360px;max-width:100vw;display:none;flex-direction:column;
    background:var(--panel);border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(0,0,0,.10)}
  #names.show{display:flex}
  #names .nh{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:relative;flex:none}
  #names .nh .lt{font-weight:700;font-size:15.5px;padding-right:22px}
  #names .nh .lc{font-size:12px;color:var(--muted);margin-top:2px}
  #names .x{position:absolute;top:12px;right:14px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
  #names .nfilter{width:100%;font:inherit;font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;margin-top:9px}
  #names .nlist{overflow:auto;padding:4px 8px 6px;flex:1}
  #names .nrow{padding:7px 8px;font-size:12.5px;border-top:1px solid #f1f3f5;line-height:1.4}
  #names .nrow:first-child{border-top:0}
  #names .nrow .nm{font-weight:600}
  #names .nrow .dt{color:var(--muted);font-size:11.5px}
  #names .nrow a{color:var(--accent);text-decoration:none;font-size:11.5px}#names .nrow a:hover{text-decoration:underline}
  .pill{display:inline-block;font-size:10px;background:#eef1f4;color:var(--muted);border-radius:10px;padding:1px 8px;white-space:nowrap}
  #names .pager{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding:9px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  #names .pager button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;color:var(--ink)}
  #names .pager button:disabled{opacity:.4;cursor:default}
  /* niet op de kaart — Carnegie-stijl */
  #nokBtn{position:fixed;right:14px;bottom:14px;z-index:1100;display:flex;align-items:center;gap:7px;background:#fff;
    border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.10)}
  #nokBtn:hover{border-color:var(--accent)}
  #nokBtn .unc{font-size:11px;color:#fff;background:var(--accent);border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums}
  #nok{position:fixed;right:14px;bottom:14px;z-index:1102;width:360px;max-width:calc(100vw - 28px);max-height:min(70vh,540px);
    background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.16);display:none;flex-direction:column}
  #nok.open{display:flex}
  #nok .nhd{padding:13px 15px 9px;border-bottom:1px solid var(--line);position:relative}
  #nok .lt{font-weight:700;font-size:14px}#nok .lc{font-size:12px;color:var(--muted);margin-top:1px}
  #nok .x{position:absolute;top:11px;right:13px;cursor:pointer;color:var(--muted);font-size:18px}
  #nok .note{font-size:11.5px;color:var(--muted);padding:8px 15px 4px}
  #nok .rows{overflow:auto;padding:0 8px 10px}
  #nok .nrow{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:6px 7px;border-top:1px solid #eef1f3;cursor:pointer;border-radius:6px}
  #nok .nrow:hover{background:#f2f5f7}
  #nok .nrow b{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
  .credit{position:fixed;left:14px;bottom:8px;z-index:1000;font-size:10px;color:#5a636c;background:#ffffffcc;padding:2px 7px;border-radius:6px}
  #map.zooming .leaflet-overlay-pane{opacity:0;transition:none}
  .leaflet-popup-content{font-size:12.5px;line-height:1.5;margin:11px 13px}
  .leaflet-popup-content b{font-size:13.5px}
  a{color:var(--accent)}
  @media(max-width:640px){#side,#nok{width:calc(100vw - 28px)}#names{width:100vw}.legend{bottom:56px}}
</style>
</head>
<body>
<nav class="ptabs"><a href="./" class="on">🗺️ Kaart</a><a href="./inzichten/">📊 Inzichten</a><a href="./over/">ℹ️ Over</a><a href="https://archief.alanmoss.nl/" class="ext" title="Alle archiefprojecten">← Archief</a></nav>
<div id="map"></div>
<div id="viztip"></div>
<aside id="side"><div class="pad">
  <h1>Oorlogsgravenstichting<span class="qm" data-tip="De personen uit het archief van de Oorlogsgravenstichting (Nationaal Archief, toegang 2.19.255). Elke stip bundelt de mensen die op die plaats geboren zijn, of daar zijn omgekomen. De aantallen betreffen de in dit archief vastgelegde personen; achter elk punt gaan individuele levens schuil.">?</span></h1>
  <div class="sub">Nederlandse oorlogsslachtoffers 1940–1945, op de kaart</div>
  <div class="srcline">Bron: <a href="https://www.nationaalarchief.nl/onderzoeken/archief/2.19.255" target="_blank" rel="noopener">NA, Oorlogsgravenstichting 2.19.255</a></div>
  <div class="count"><b id="cnt">…</b> <span id="cntlbl">personen geplaatst</span> <span class="pct" id="cntpct"></span></div>

  <div class="flabel">Toon op de kaart</div>
  <div class="modes" id="modes">
    <button data-m="herkomst" class="on">Herkomst</button>
    <button data-m="overlijden">Waar omgekomen</button>
  </div>

  <div class="searchgroup">
    <div class="flabel">Zoeken op</div>
    <div class="stog" id="stog">
      <button data-s="plaats" class="on">Plaatsen</button>
      <button data-s="persoon">Personen</button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Zoek een plaats…" autocomplete="off">
      <div class="sug" id="sug"></div></div>
  </div>
</div>
  <div class="pfoot"><a href="mailto:mossalan@gmail.com?subject=OGS-kaart%3A%20feedback%20of%20een%20fout%20melden">✉︎ Feedback of een fout melden</a></div>
</aside>
<div class="legend" id="legend"></div>

<div id="names">
  <div class="nh"><span class="x" onclick="closeNames()">×</span><div class="lt" id="nTitle"></div><div class="lc" id="nCount"></div>
    <input class="nfilter" id="nFilter" type="search" placeholder="Filter op naam…" oninput="nfilter()"></div>
  <div class="nlist" id="nlist"></div>
  <div class="pager" id="nPager"></div>
</div>

<button id="nokBtn">Niet op de kaart <span class="unc" id="nokCt"></span></button>
<div id="nok">
  <div class="nhd"><span class="x" onclick="document.getElementById('nok').classList.remove('open')">×</span>
    <div class="lt">Niet op de kaart <span class="qm" data-tip="Personen met een plaats die niet als punt op de kaart is weer te geven: op zee, in transport, een omschrijving als &quot;omgeving&quot;, alleen een land, of onbekend. Klik een plaats voor de namen.">?</span></div>
    <div class="lc" id="nokCount"></div></div>
  <div class="rows" id="nokRows"></div>
</div>
<div class="credit">Kaart © OpenStreetMap-bijdragers</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BUILD='20260824-6';
const TOTAAL=197865;
const esc=s=>(s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n||0).toLocaleString('nl');
const CHO=[[1,'#c7d0d8','1'],[2,'#a9b6c1','2–5'],[6,'#8b9bab','6–25'],[26,'#6d8194','26–100'],
           [101,'#556a7e','101–500'],[501,'#3f5468','501–2.000'],[2001,'#2b3b4a','2.000+']];
function choColor(n){let c=CHO[0][1];for(const[t,col]of CHO)if(n>=t)c=col;return c;}
function nlDate(s){if(!s)return '';const[y,m,d]=s.split('-');if(!y||y==='0000')return '';
  const M=['','jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  if(d&&d!=='00'&&m&&m!=='00')return `${+d} ${M[+m]} ${y}`;if(m&&m!=='00')return `${M[+m]} ${y}`;return y;}

const map=L.map('map',{zoomControl:false,preferCanvas:false}).setView([50.5,9],5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {subdomains:'abcd',maxZoom:19,attribution:''}).addTo(map);
const gDot=L.layerGroup().addTo(map);
map.on('zoomstart',()=>document.getElementById('map').classList.add('zooming'));
map.on('zoomend',  ()=>document.getElementById('map').classList.remove('zooming'));

let DATA=null, PERS=null, persLoading=false;
let state={mode:'herkomst', stog:'plaats', q:''};

function bindTips(){const tip=document.getElementById('viztip');
  document.querySelectorAll('[data-tip]').forEach(el=>{if(el._tb)return;el._tb=1;
    el.addEventListener('mouseenter',()=>{tip.innerHTML=el.dataset.tip;tip.classList.add('on');});
    el.addEventListener('mousemove',e=>{let x=e.clientX+14,y=e.clientY+14;if(x+tip.offsetWidth>innerWidth-8)x=e.clientX-tip.offsetWidth-14;tip.style.left=x+'px';tip.style.top=y+'px';});
    el.addEventListener('mouseleave',()=>tip.classList.remove('on'));});}

const lblOmg=()=>state.mode==='herkomst'?'hier geboren':'hier omgekomen';
function buildLegend(){
  const t=state.mode==='herkomst'?'geboren op deze plaats':'omgekomen op deze plaats';
  document.getElementById('legend').innerHTML=`<div class="lt">Vastgelegde personen · ${t}</div>`+
    CHO.map(c=>`<div class="legrow"><span class="sw" style="background:${c[1]}"></span>${c[2]}</div>`).join('');
}
function updCount(){
  const dots=DATA[state.mode], n=dots.reduce((s,d)=>s+d.n,0);
  document.getElementById('cnt').textContent=fmt(n);
  document.getElementById('cntlbl').textContent = state.mode==='herkomst'?'personen op geboorteplaats':'personen op sterfteplaats';
  document.getElementById('cntpct').textContent = `(${Math.round(100*n/TOTAAL)}% van het archief)`;
  document.getElementById('nokCt').textContent = fmt(DATA.niet_op_kaart[state.mode].reduce((s,x)=>s+x[1],0));
}
function render(){
  gDot.clearLayers();
  DATA[state.mode].forEach((d,i)=>{
    const m=L.circleMarker([d.lat,d.lon],{radius:5,color:'#2b3b4a',weight:.6,fillColor:choColor(d.n),fillOpacity:.9});
    m.on('click',()=>openDot(i,true));
    gDot.addLayer(m);
  });
  buildLegend(); updCount();
}
function loadPers(cb){ if(PERS){cb&&cb();return;} if(persLoading)return; persLoading=true;
  fetch('personen.json?v='+BUILD).then(r=>r.json()).then(d=>{PERS=d;persLoading=false;cb&&cb();}); }

function openDot(i, fromClick){
  const d=DATA[state.mode][i];
  const card=`<b>${esc(d.p)}</b><br><b style="font-size:12px">${fmt(d.n)}</b> vastgelegde personen · ${lblOmg()}`+
    `<div style="margin-top:8px"><a href="#" onclick="openNames(${i});return false">Toon de namen →</a></div>`;
  const open=()=>L.popup({maxWidth:280}).setLatLng([d.lat,d.lon]).setContent(card).openOn(map);
  if(fromClick){ open(); }
  else { map.setView([d.lat,d.lon],Math.max(map.getZoom(),8),{animate:true}); setTimeout(open,340); }
}

// ---- namenpaneel (vast, rechts) met paginering + filter ----
let nAll=null, nFiltered=null, nPage=0; const NPER=100;
function showNamesPanel(title, list){
  document.getElementById('nok').classList.remove('open');   // niet-op-kaart-lijst sluiten
  nAll=list.sort((a,b)=>a.n.localeCompare(b.n,'nl'));
  document.getElementById('nTitle').textContent=title;
  document.getElementById('nCount').innerHTML=`${fmt(nAll.length)} vastgelegde personen · ${lblOmg()}`;
  document.getElementById('nFilter').value=''; nfilter();
  document.getElementById('names').classList.add('show');
}
function openNames(i){
  const d=DATA[state.mode][i], key=state.mode==='herkomst'?'hi':'oi';
  loadPers(()=>showNamesPanel(d.p, PERS.filter(p=>p[key]===i)));
}
function openNamesForPlace(place){
  const key=state.mode==='herkomst'?'gp':'op';
  loadPers(()=>showNamesPanel(place, PERS.filter(p=>p[key]===place)));
}
window.openNamesForPlace=openNamesForPlace;
function nfilter(){
  const q=(document.getElementById('nFilter').value||'').toLowerCase();
  nFiltered = q ? nAll.filter(p=>p.n.toLowerCase().includes(q)) : nAll;
  nPage=0; renderNames();
}
function personRow(p){
  const geb=nlDate(p.gd), ov=nlDate(p.od);
  const line = state.mode==='herkomst'
    ? [geb?('geb. '+geb):'', ov?('overl. '+ov+(p.op?', '+esc(p.op):'')):''].filter(Boolean).join(' · ')
    : [geb?('geb. '+geb+(p.gp?', '+esc(p.gp):'')):'', ov?('overl. '+ov):''].filter(Boolean).join(' · ');
  const links=[];
  if(p.na)links.push(`<a href="https://www.nationaalarchief.nl/onderzoeken/index/nt00446/${esc(p.na)}" target="_blank" rel="noopener">Dossier (NA) ↗</a>`);
  if(p.na2)links.push(`<a href="https://www.nationaalarchief.nl/onderzoeken/index/nt00446/${esc(p.na2)}" target="_blank" rel="noopener">Correspondentiedossier (NA) ↗</a>`);
  if(p.u)links.push(`<a href="https://oorlogsgravenstichting.nl/${esc(p.u)}" target="_blank" rel="noopener">OGS ↗</a>`);
  const foreign=(p.nat&&p.nat!=='NEDERLANDS'&&p.nat!=='ONBEKEND')?` <span class="dt">· ${esc(p.nat.toLowerCase())}</span>`:'';
  const pill=!p.gd?` <span class="pill">geboortedatum niet gematcht</span>`:'';
  return `<div class="nrow"><span class="nm">${esc(p.n)}</span>${foreign}<br><span class="dt">${line}</span>${pill}`+
    (links.length?`<br>${links.join(' · ')}`:'')+`</div>`;
}
function renderNames(){
  if(!nFiltered)return;
  const pages=Math.max(1,Math.ceil(nFiltered.length/NPER));
  if(nPage>=pages)nPage=pages-1;
  const slice=nFiltered.slice(nPage*NPER,(nPage+1)*NPER);
  document.getElementById('nlist').innerHTML = slice.length?slice.map(personRow).join(''):'<div class="nrow dt">Geen naam gevonden.</div>';
  document.getElementById('nlist').scrollTop=0;
  const pg=document.getElementById('nPager');
  if(pages>1)pg.innerHTML=`<button onclick="npage(-1)" ${nPage===0?'disabled':''}>‹</button>`+
    `<span>${nPage+1} / ${pages} · ${fmt(nFiltered.length)} namen</span>`+
    `<button onclick="npage(1)" ${nPage>=pages-1?'disabled':''}>›</button>`;
  else pg.innerHTML='';
}
function npage(d){const pages=Math.ceil(nFiltered.length/NPER);nPage=Math.max(0,Math.min(pages-1,nPage+d));renderNames();}
function closeNames(){document.getElementById('names').classList.remove('show');}
window.openNames=openNames;window.closeNames=closeNames;window.npage=npage;window.nfilter=nfilter;

// ---- zoeken ----
function runSearch(term){
  const sug=document.getElementById('sug'), t=term.trim().toLowerCase();
  if(t.length<2){sug.style.display='none';return;}
  const wantP=state.stog!=='persoon', wantN=state.stog!=='plaats';
  let html='';
  const dots=DATA[state.mode];
  const ph=wantP?dots.map((d,i)=>[d,i]).filter(([d])=>d.p.toLowerCase().includes(t)).sort((a,b)=>b[0].n-a[0].n).slice(0,6):[];
  if(ph.length)html+=`<div class="hdr">${state.mode==='herkomst'?'Herkomstplaatsen':'Sterfteplaatsen'}</div>`+ph.map(([d,i])=>
    `<a data-dot="${i}"><b>${esc(d.p)}</b> <small>· ${fmt(d.n)} personen</small></a>`).join('');
  if(wantN){
    if(!PERS){ html+='<div class="hdr">Personen</div><a style="color:#999;cursor:default">personen laden…</a>'; loadPers(()=>runSearch(term)); }
    else{
      const nh=PERS.filter(p=>p.n.toLowerCase().includes(t)).slice(0,8); window._sh=nh;
      if(nh.length)html+='<div class="hdr">Personen</div>'+nh.map((p,i)=>{
        const geb=nlDate(p.gd),ov=nlDate(p.od);
        return `<a data-pp="${i}"><b>${esc(p.n)}</b> <small>· ${[geb,ov?('† '+ov):''].filter(Boolean).join(' ')}${p.gp?', '+esc(p.gp):''}</small></a>`;}).join('');
      else if(t.length>=3)html+='<div class="hdr">Personen</div><a style="color:#999;cursor:default">geen persoon gevonden</a>';
    }
  }
  sug.innerHTML=html; sug.style.display='block';
  ph.forEach(([d,i])=>{const el=sug.querySelector(`[data-dot="${i}"]`);if(el)el.onclick=()=>{sug.style.display='none';openDot(i,false);};});
  (window._sh||[]).forEach((p,i)=>{const el=sug.querySelector(`[data-pp="${i}"]`);if(el)el.onclick=()=>selectPerson(p);});
}
function selectPerson(p){
  document.getElementById('sug').style.display='none';
  const idx=state.mode==='herkomst'?p.hi:p.oi;
  if(idx>=0){const d=DATA[state.mode][idx];map.setView([d.lat,d.lon],Math.max(map.getZoom(),8),{animate:true});
    setTimeout(()=>{openNames(idx);document.getElementById('nFilter').value=p.n;nfilter();},360);}
  else{
    const geb=nlDate(p.gd),ov=nlDate(p.od);
    const links=[];
    if(p.na)links.push(`<a href="https://www.nationaalarchief.nl/onderzoeken/index/nt00446/${esc(p.na)}" target="_blank" rel="noopener">Dossier (NA) ↗</a>`);
    if(p.u)links.push(`<a href="https://oorlogsgravenstichting.nl/${esc(p.u)}" target="_blank" rel="noopener">OGS ↗</a>`);
    L.popup({maxWidth:280}).setLatLng(map.getCenter()).setContent(
      `<b>${esc(p.n)}</b><br><span style="color:#6b7480">${[geb?('geb. '+geb):'',ov?('overl. '+ov):''].filter(Boolean).join(' · ')}</span>`+
      `<br><span style="color:#6b7480">${esc(p.gp||'')}${p.op?' → '+esc(p.op):''}</span> <small style="color:#9aa4ac">(in deze weergave niet op de kaart)</small>`+
      (links.length?`<br>${links.join(' · ')}`:'')).openOn(map);
  }
}
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;runSearch(e.target.value);});
document.getElementById('q').addEventListener('focus',()=>{if(state.stog==='persoon')loadPers();});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))document.getElementById('sug').style.display='none';});
document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('click',()=>{
  state.mode=b.dataset.m;
  document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x===b));
  map.closePopup(); closeNames(); render();
  if(document.getElementById('q').value)runSearch(document.getElementById('q').value);
}));
document.querySelectorAll('#stog button').forEach(b=>b.addEventListener('click',e=>{
  e.stopPropagation(); state.stog=b.dataset.s;
  document.querySelectorAll('#stog button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('q').placeholder = state.stog==='persoon'?'Zoek een naam…':'Zoek een plaats…';
  if(state.stog==='persoon')loadPers();
  document.getElementById('q').focus(); runSearch(document.getElementById('q').value);
}));

// niet op de kaart
function showNok(){
  const list=DATA.niet_op_kaart[state.mode], tot=list.reduce((s,x)=>s+x[1],0);
  document.getElementById('nokCount').textContent=`${fmt(tot)} personen · ${lblOmg()}`;
  const rows=list.slice(0,400);
  document.getElementById('nokRows').innerHTML=rows.map((x,i)=>`<div class="nrow" data-i="${i}"><span>${esc(x[0])}</span><b>${fmt(x[1])}</b></div>`).join('');
  document.querySelectorAll('#nokRows .nrow').forEach((el,i)=>el.onclick=()=>openNamesForPlace(rows[i][0]));
}
document.getElementById('nokBtn').addEventListener('click',()=>{const n=document.getElementById('nok');if(n.classList.contains('open')){n.classList.remove('open');}else{showNok();n.classList.add('open');bindTips();}});

fetch('ogs_data.json?v='+BUILD).then(r=>r.json()).then(d=>{DATA=d;render();bindTips();
    const pts=[...d.herkomst,...d.overlijden].map(x=>[x.lat,x.lon]);
    if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[25,25],maxZoom:6});
  })
  .catch(()=>{document.querySelector('.srcline').insertAdjacentHTML('afterbegin','<span style="color:#a3312d">Kon de data niet laden.</span><br>');});
</script>
</body>
